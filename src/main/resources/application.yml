spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dragonfly_blog
    username: root
    password: ${MYSQL_PASSWORD}
  data:
      redis:
        host: localhost
        port: 6379
        password: ${REDIS_PASSWORD}
        database: 0
        timeout: 5000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s
#    level:
#          # 开发环境：只打印 SQL，不打印参数和结果
#          com.yourpackage.mapper: DEBUG
#  profiles:
#    group:
#      "dev": devServer,devDB,devSelf
#    active: dev
# application.yml
server:
  tomcat:
    threads:
      max: 500
      min-spare: 50


  datasource:
    hikari:
      maximum-pool-size: 100


  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: dragonfly-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: notification:com.dragonfly.pojo.Notification





