mybatis:
  configuration:
    map-underscore-to-camel-case: true #开启驼峰命名和下滑线命名转换
mybatis-plus:
  mapper-locations: classpath*:/com/dragonfly/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 搜索配置
search:
  hot-keywords:
    ttl: 86400  # 热门搜索缓存时间（秒）
  search-history:
    max-size: 10  # 每个用户最多保存的搜索历史数量

