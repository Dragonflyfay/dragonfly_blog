version: '3.8'

services:
  # ========== 数据库 ==========
  mysql:
    image: mysql:8.0.33
    container_name: dragonfly-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: dragonfly_blog
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dragonfly-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ========== 缓存 ==========
  redis:
    image: redis:7.2-alpine
    container_name: dragonfly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dragonfly-network
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  # ========== 搜索引擎 ==========
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: dragonfly-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - dragonfly-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: dragonfly-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - dragonfly-network

  # ========== 消息队列 ==========
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: dragonfly-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - dragonfly-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: dragonfly-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - dragonfly-network

volumes:
  mysql_data:
  redis_data:
  es_data:

networks:
  dragonfly-network:
    driver: bridge